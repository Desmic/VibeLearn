# Render Blueprint: the Bellweather demo ("The First Words") as a free static site.
# Render: New > Blueprint > pick this repo. Every push to main that touches the game rebuilds it.
services:
  - type: web
    name: bellweather-first-words
    runtime: static
    # (from the repo root: the game lives in experiments/bellweather-arcade)
    buildCommand: bash experiments/bellweather-arcade/tools/build-web.sh
    staticPublishPath: ./experiments/bellweather-arcade/dist/web
    buildFilter:
      paths:
        - experiments/bellweather-arcade/**
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /voice/*
        name: Cache-Control
        value: public, max-age=604800
