services:
  - type: web
    name: vibelearn
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.lock && python manage.py vendor
    startCommand: gunicorn 'app.hosted:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        value: https://pwipqbhkxekyglxkacey.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
