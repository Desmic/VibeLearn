name: Verify hosted pilot
on:
  pull_request:
  push:
    branches: [main, deploy/render-supabase]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [foundation, first-words-opening, first-words-tutorial, first-words-controls, first-words-chapter, first-words-readability, first-words-lifecycle]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: vibelearn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/vibelearn_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package tracked review source (never runtime data or credentials)
        if: matrix.suite == 'foundation'
        run: git archive --format=tar HEAD -o /tmp/vibelearn-review-source.tar
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'foundation'
        with:
          name: review-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/vibelearn-review-source.tar
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py vendor
      - run: python manage.py build
      - run: python manage.py test
        if: matrix.suite == 'foundation'
      - run: python manage.py browser --group ${{ matrix.suite }}
      - name: Preserve browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-review-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.suite }}
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*trace.zip
            web/vendor/*
          retention-days: 7
