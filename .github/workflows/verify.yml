name: Verify hosted pilot
on:
  pull_request:
  push:
    branches: [main, deploy/render-supabase]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [foundation, first-words-opening, first-words-tutorial, first-words-controls, first-words-chapter, first-words-readability, first-words-lifecycle]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: vibelearn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/vibelearn_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package tracked review source (never runtime data or credentials)
        if: matrix.suite == 'foundation'
        run: |
          mkdir -p artifacts
          git archive --format=tar HEAD -o artifacts/review-source.tar
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'foundation'
        with:
          name: review-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/review-source.tar
          retention-days: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py vendor
      - run: python manage.py build
      - run: python manage.py test
        if: matrix.suite == 'foundation'
      - run: python manage.py browser --group ${{ matrix.suite }}
      - name: Build exact-candidate evidence receipt
        if: always()
        run: |
          mkdir -p artifacts
          python -m tools.build_evidence_receipt \
            --root artifacts \
            --candidate "${{ github.event.pull_request.head.sha || github.sha }}" \
            --suite "${{ matrix.suite }}" \
            --output "artifacts/evidence-receipt-${{ matrix.suite }}.json"
      - name: Preserve browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-review-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.suite }}
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*.webm
            artifacts/*.tar
            artifacts/*trace.zip
            web/vendor/*
          retention-days: 30

  review-index:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact-candidate evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: game-review-evidence-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: /tmp/vibelearn-review-evidence
      - name: Build exact-candidate review index
        run: |
          mkdir -p /tmp/vibelearn-review-index
          python -m tools.build_review_index \
            --root /tmp/vibelearn-review-evidence \
            --candidate "${{ github.event.pull_request.head.sha || github.sha }}" \
            --technical-result "${{ needs.tests.result }}" \
            --output "/tmp/vibelearn-review-index/review-evidence-index-${{ github.event.pull_request.head.sha || github.sha }}.json"
      - name: Build context-separated critic assignments
        run: |
          mkdir -p /tmp/vibelearn-review-index/critic-assignments
          python -m tools.build_critic_assignments \
            --index "/tmp/vibelearn-review-index/review-evidence-index-${{ github.event.pull_request.head.sha || github.sha }}.json" \
            --output-dir /tmp/vibelearn-review-index/critic-assignments
      - name: Materialize sealed capsules for ready critic passes
        run: |
          python -m tools.materialize_ready_critic_capsules \
            --assignments-dir /tmp/vibelearn-review-index/critic-assignments \
            --evidence-root /tmp/vibelearn-review-evidence \
            --output-root /tmp/vibelearn-review-index/critic-capsules
      - name: Upload exact-candidate review index, assignments and sealed capsules
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-index-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/vibelearn-review-index/*.json
            /tmp/vibelearn-review-index/critic-assignments/*.json
            /tmp/vibelearn-review-index/critic-capsules/**
          retention-days: 30
