name: Verify hosted pilot
on:
  pull_request:
  push:
    branches: [main, deploy/render-supabase]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: vibelearn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/vibelearn_test
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked review source (never runtime data or credentials)
        run: git archive --format=tar HEAD -o /tmp/vibelearn-review-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.sha }}
          path: /tmp/vibelearn-review-source.tar
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py vendor
      - run: python manage.py build
      - run: python manage.py test
      - run: python manage.py browser
      - name: Preserve browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-review-evidence-${{ github.sha }}
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*trace.zip
            web/vendor/*
          retention-days: 7
